<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体 - 林夏的个人网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
        }

        @media (min-width: 768px) {
            body {
                padding: 2rem;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 1rem;
        }

        .header a:hover {
            color: white;
        }

        .header-actions {
            margin-top: 1rem;
        }

        .header-actions a {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            margin: 0 0.25rem;
            transition: background 0.2s;
        }

        .header-actions a:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 瀑布流网格布局 */
        .media-grid {
            column-count: 2;
            column-gap: 1rem;
        }

        @media (min-width: 768px) {
            .media-grid {
                column-count: 3;
                column-gap: 1.5rem;
            }
        }

        @media (min-width: 1024px) {
            .media-grid {
                column-count: 4;
            }
        }

        .media-item {
            break-inside: avoid;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        @media (min-width: 768px) {
            .media-item {
                margin-bottom: 1.5rem;
            }
        }

        .media-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .media-item img,
        .media-item video {
            width: 100%;
            height: auto;
            display: block;
        }

        .media-caption {
            padding: 1rem;
            color: #555;
            font-size: 0.95rem;
            text-align: center;
        }

        .media-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .media-actions {
            margin-top: 0.75rem;
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .media-actions button {
            background: rgba(102, 126, 234, 0.8);
            color: white;
            border: none;
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 767px) {
            .media-actions button {
                padding: 0.6rem 0.9rem;
                font-size: 0.85rem;
                flex: 1 1 40%;
            }
        }

        .media-actions button:hover {
            background: rgba(102, 126, 234, 1);
        }

        .media-actions .btn-delete {
            background: rgba(220, 53, 69, 0.8);
        }

        .media-actions .btn-delete:hover {
            background: rgba(220, 53, 69, 1);
        }

        .filename {
            font-family: monospace;
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.5rem;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 媒体墙</h1>
            <a href="/">← 返回首页</a>
            <div class="header-actions">
                <a href="/upload-media">📤 上传媒体</a>
            </div>
        </div>
        <div class="media-grid">
            {{media_items}}
        </div>
    </div>

    <script>
        async function deleteMedia(filename) {
            if (!confirm(`确定要删除 "${filename}" 吗？此操作不可恢复。`)) {
                return;
            }

            const item = document.querySelector(`[data-filename="${filename}"]`);
            const mediaType = item.dataset.type;

            try {
                const res = await fetch(`/api/media/${filename}/${mediaType}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                if (res.ok) {
                    item.remove();
                    alert('删除成功');
                } else {
                    alert('删除失败：' + (data.error || '未知错误'));
                }
            } catch (err) {
                alert('网络错误：' + err.message);
            }
        }

        async function renameMedia(filename, displayName) {
            const newName = prompt('请输入新名称（自动保留原文件后缀）：', displayName);
            if (!newName || newName === displayName) {
                return;
            }

            const item = document.querySelector(`[data-filename="${filename}"]`);
            const mediaType = item.dataset.type;

            try {
                const res = await fetch(`/api/media/${filename}/${mediaType}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ new_filename: newName, media_type: mediaType })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('重命名成功');
                    window.location.reload();
                } else {
                    alert('重命名失败：' + (data.error || '未知错误'));
                }
            } catch (err) {
                alert('网络错误：' + err.message);
            }
        }
    </script>
</body>
</html>
