[package]
name = "marchs-website"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
pulldown-cmark = "0.13"
tower-http = { version = "0.6", features = ["fs"] }
axum-extra = { version = "0.10", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
