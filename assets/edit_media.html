<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑媒体 - 林夏的个人网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
        }

        @media (min-width: 768px) {
            body {
                padding: 2rem;
            }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: white;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .header a:hover {
            color: white;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .help-text {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.5rem;
        }

        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #5a6fd6;
        }

        .btn-secondary {
            background: #888;
        }

        .btn-secondary:hover {
            background: #777;
        }

        .btn-delete {
            background: #dc3545;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .action-buttons .btn {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✏️ 编辑媒体</h1>
            <a href="/media">← 返回媒体墙</a>
        </div>
        <div class="form-container">
            <div id="message-area"></div>

            <form id="edit-form">
                <input type="hidden" id="filename" value="{{filename}}">
                <input type="hidden" id="media_type" value="{{media_type}}">
                <div class="form-group">
                    <label for="new_filename">文件名（不含后缀）</label>
                    <input type="text" id="new_filename" value="{{display_name}}" required>
                    <p class="help-text">修改后自动保留原文件后缀</p>
                </div>
                <button type="submit" class="btn">💾 保存更改</button>
                <div class="action-buttons">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='/media'">返回</button>
                    <button type="button" class="btn btn-delete" onclick="deleteMedia()">🗑️ 删除</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function showMessage(text, type) {
            const area = document.getElementById('message-area');
            area.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => area.innerHTML = '', 3000);
        }

        async function deleteMedia() {
            const filename = document.getElementById('filename').value;
            const mediaType = document.getElementById('media_type').value;
            
            if (!confirm(`确定要删除 "${filename}" 吗？此操作不可恢复。`)) {
                return;
            }

            try {
                const res = await fetch(`/api/media/${filename}/${mediaType}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                if (res.ok) {
                    alert('删除成功');
                    window.location.href = '/media';
                } else {
                    alert('删除失败：' + (data.error || '未知错误'));
                }
            } catch (err) {
                alert('网络错误：' + err.message);
            }
        }

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const filename = document.getElementById('filename').value;
            const mediaType = document.getElementById('media_type').value;
            const newFilename = document.getElementById('new_filename').value;

            try {
                const res = await fetch(`/api/media/${filename}/${mediaType}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ new_filename: newFilename })
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage('重命名成功！跳转到媒体墙...');
                    setTimeout(() => {
                        window.location.href = '/media';
                    }, 1000);
                } else {
                    showMessage(data.error || '重命名失败', 'error');
                }
            } catch (err) {
                showMessage('网络错误：' + err.message, 'error');
            }
        });
    </script>
</body>
</html>
