<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查看媒体 - 林夏的个人网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
        }

        @media (min-width: 768px) {
            body {
                padding: 2rem;
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .header a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 1rem;
        }

        .header a:hover {
            color: white;
        }

        .media-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .media-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: 80vh;
        }

        .media-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            border-radius: 8px;
            object-fit: contain;
        }

        .media-wrapper video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            border-radius: 8px;
            object-fit: contain;
            background: #000;
        }

        .media-info {
            padding: 1rem;
            text-align: center;
            color: #555;
        }

        .media-info .filename {
            font-family: monospace;
            font-size: 0.9rem;
            color: #666;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{media_type}}</h1>
            <a href="/media">← 返回媒体墙</a>
        </div>
        <div class="media-container">
            {{media_content}}
            <div class="media-info">
                <div class="filename">{{filename}}</div>
            </div>
        </div>
    </div>
    <script>
        // Force reload poster images to bypass cache
        document.addEventListener('DOMContentLoaded', function() {
            const videos = document.querySelectorAll('video[poster]');
            videos.forEach(video => {
                const poster = video.getAttribute('poster');
                if (poster) {
                    // Add timestamp to bypass cache
                    video.setAttribute('poster', poster + (poster.includes('?') ? '&' : '?') + 'reload=' + Date.now());
                    
                    // Add error handler to hide broken poster
                    video.addEventListener('error', function() {
                        this.removeAttribute('poster');
                    });
                }
            });
        });
    </script>
</body>
</html>
