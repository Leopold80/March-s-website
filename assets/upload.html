<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传媒体 - 林夏的个人网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 1rem;
        }

        .header a:hover {
            color: white;
        }

        .upload-form {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .form-group input[type="file"],
        .form-group input[type="text"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-group input[type="file"] {
            padding: 0.5rem;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #5a6fd6;
        }

        .btn-secondary {
            background: #888;
        }

        .btn-secondary:hover {
            background: #777;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            overflow: hidden;
        }

        .tab {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        .tab.active {
            background: white;
            color: #667eea;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .help-text {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📤 上传内容</h1>
            <a href="/">← 返回首页</a>
        </div>
        <div class="upload-form">
            <div class="tabs">
                <a class="tab active" onclick="switchTab('media')">媒体上传</a>
                <a class="tab" onclick="switchTab('log')">日志编辑</a>
            </div>

            <div id="message-area"></div>

            <form id="media-form" class="form-section active" enctype="multipart/form-data" method="POST" action="/api/upload/media">
                <div class="form-group">
                    <label for="type">类型</label>
                    <select name="type" id="type" required>
                        <option value="photo">照片</option>
                        <option value="video">视频</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="file">选择文件</label>
                    <input type="file" name="file" id="file" accept="image/*,video/*" required>
                    <p class="help-text">支持 JPG, PNG, GIF, WEBP (照片) / MP4, WEBM, MOV (视频)</p>
                </div>
                <button type="submit" class="btn">上传</button>
            </form>

            <form id="log-form" class="form-section" method="POST" action="/api/logs">
                <div class="form-group">
                    <label for="slug">文件名 (Slug)</label>
                    <input type="text" name="slug" id="slug" placeholder="YYYY-MM-DD-title" required>
                    <p class="help-text">建议使用格式：2024-01-15-my-post</p>
                </div>
                <div class="form-group">
                    <label for="title">标题</label>
                    <input type="text" name="title" id="title" required>
                </div>
                <div class="form-group">
                    <label for="date">日期</label>
                    <input type="date" name="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="content">内容 (Markdown)</label>
                    <textarea name="content" id="content" placeholder="支持 Markdown 语法..." required></textarea>
                </div>
                <button type="submit" class="btn">保存日志</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            
            if (tab === 'media') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('media-form').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('log-form').classList.add('active');
                document.getElementById('date').valueAsDate = new Date();
            }
        }

        function showMessage(text, type) {
            const area = document.getElementById('message-area');
            area.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => area.innerHTML = '', 3000);
        }

        document.getElementById('media-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            try {
                const res = await fetch('/api/upload/media', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    showMessage('上传成功！', 'success');
                    e.target.reset();
                } else {
                    showMessage(data.error || '上传失败', 'error');
                }
            } catch (err) {
                showMessage('网络错误', 'error');
            }
        });

        document.getElementById('log-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            try {
                const res = await fetch('/api/logs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    showMessage('保存成功！', 'success');
                    e.target.reset();
                } else {
                    showMessage(result.error || '保存失败', 'error');
                }
            } catch (err) {
                showMessage('网络错误', 'error');
            }
        });
    </script>
</body>
</html>
