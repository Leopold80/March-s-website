<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传媒体 - 林夏的个人网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 1rem;
        }

        .header a:hover {
            color: white;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .form-group input[type="file"],
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group input[type="file"] {
            padding: 0.5rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #5a6fd6;
        }

        .btn-secondary {
            background: #888;
        }

        .btn-secondary:hover {
            background: #777;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .help-text {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.5rem;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .actions .btn {
            flex: 1;
        }

        .progress-container {
            margin-top: 1.5rem;
            display: none;
        }

        .progress-container.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 24px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 12px;
        }

        .progress-text {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }

        .uploading .btn {
            opacity: 0.6;
            pointer-events: none;
        }

        .uploading .progress-actions .btn {
            opacity: 1;
            pointer-events: auto;
        }

        .progress-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn-cancel {
            background: #dc3545;
            padding: 0.5rem 1.5rem;
            font-size: 0.9rem;
        }

        .btn-cancel:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📤 上传媒体</h1>
            <a href="/">← 返回首页</a>
        </div>
        <div class="form-container">
            <div id="message-area"></div>

            <form id="media-form" enctype="multipart/form-data" method="POST" action="/api/upload/media">
                <div class="form-group">
                    <label for="type">类型</label>
                    <select name="type" id="type" required>
                        <option value="photo">照片</option>
                        <option value="video">视频</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="file">选择文件</label>
                    <input type="file" name="file" id="file" accept="image/*,video/*" required>
                    <p class="help-text">支持 JPG, PNG, GIF, WEBP (照片) / MP4, WEBM, MOV (视频)，最大 30GB</p>
                </div>
                <div class="actions">
                    <button type="submit" class="btn" id="submit-btn">上传</button>
                    <a href="/media" class="btn btn-secondary">取消</a>
                </div>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="progress-text" id="progress-text">上传中... 0%</div>
                    <div class="progress-actions">
                        <button type="button" class="btn btn-cancel" id="cancel-btn">取消上传</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentXhr = null;

        function showMessage(text, type) {
            const area = document.getElementById('message-area');
            area.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => area.innerHTML = '', 3000);
        }

        function updateProgress(percent) {
            const fill = document.getElementById('progress-fill');
            const text = document.getElementById('progress-text');
            
            fill.style.width = percent + '%';
            text.textContent = `上传中... ${percent.toFixed(1)}%`;
            
            if (percent >= 100) {
                text.textContent = '上传完成！正在处理...';
            }
        }

        function showProgress(show) {
            const container = document.getElementById('progress-container');
            const form = document.getElementById('media-form');
            const cancelBtn = document.getElementById('cancel-btn');
            
            if (show) {
                container.classList.add('show');
                form.classList.add('uploading');
                cancelBtn.disabled = false;
                cancelBtn.textContent = '取消上传';
            } else {
                container.classList.remove('show');
                form.classList.remove('uploading');
            }
        }

        function cancelUpload() {
            if (currentXhr) {
                currentXhr.abort();
                currentXhr = null;
                
                const cancelBtn = document.getElementById('cancel-btn');
                cancelBtn.disabled = true;
                cancelBtn.textContent = '已取消';
                
                showProgress(false);
                showMessage('上传已取消', 'error');
            }
        }

        document.getElementById('cancel-btn').addEventListener('click', cancelUpload);

        document.getElementById('media-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fileInput = document.getElementById('file');
            const file = fileInput.files[0];
            const MAX_SIZE = 30 * 1024 * 1024 * 1024; // 30GB

            if (!file) {
                showMessage('未选择文件', 'error');
                return;
            }
            if (file.size === 0) {
                showMessage('文件为空，请选择有效的文件', 'error');
                return;
            }
            if (file.size > MAX_SIZE) {
                showMessage('文件大小超过 30GB 限制', 'error');
                return;
            }

            const formData = new FormData(e.target);
            showProgress(true);

            try {
                const xhr = new XMLHttpRequest();
                currentXhr = xhr;
                
                xhr.upload.addEventListener('progress', (event) => {
                    if (event.lengthComputable) {
                        const percent = (event.loaded / event.total) * 100;
                        updateProgress(percent);
                    }
                });

                xhr.addEventListener('load', () => {
                    currentXhr = null;
                    
                    if (xhr.status === 413) {
                        window.location.href = '/upload-error';
                        return;
                    }
                    
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (xhr.status >= 200 && xhr.status < 300) {
                            updateProgress(100);
                            showMessage('上传成功！跳转到媒体墙...');
                            setTimeout(() => {
                                window.location.href = '/media';
                            }, 500);
                        } else {
                            showProgress(false);
                            showMessage(data.error || '上传失败', 'error');
                        }
                    } catch (err) {
                        showProgress(false);
                        showMessage('解析响应失败', 'error');
                    }
                });

                xhr.addEventListener('error', () => {
                    currentXhr = null;
                    showProgress(false);
                    showMessage('网络错误', 'error');
                });

                xhr.addEventListener('abort', () => {
                    currentXhr = null;
                    // 取消后不显示错误，由 cancelUpload 处理
                });

                xhr.open('POST', '/api/upload/media');
                xhr.send(formData);
            } catch (err) {
                currentXhr = null;
                showProgress(false);
                showMessage('网络错误：' + err.message, 'error');
            }
        });
    </script>
</body>
</html>
