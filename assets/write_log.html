<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写日志 - 林夏的个人网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 1rem;
        }

        .header a:hover {
            color: white;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 300px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #5a6fd6;
        }

        .btn-secondary {
            background: #888;
        }

        .btn-secondary:hover {
            background: #777;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .help-text {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.5rem;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .actions .btn {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 写日志</h1>
            <a href="/">← 返回首页</a>
        </div>
        <div class="form-container">
            <div id="message-area"></div>

            <form id="log-form" method="POST" action="/api/logs">
                <div class="form-group">
                    <label for="title">标题</label>
                    <input type="text" name="title" id="title" required>
                </div>
                <div class="form-group">
                    <label for="date">日期</label>
                    <input type="date" name="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="slug">文件名 (自动生成)</label>
                    <input type="text" name="slug" id="slug" placeholder="自动生成" readonly style="background: #f5f5f5;">
                    <p class="help-text">格式：YYYY-MM-DD-标题拼音/英文</p>
                </div>
                <div class="form-group">
                    <label for="content">内容 (Markdown)</label>
                    <textarea name="content" id="content" placeholder="支持 Markdown 语法..." required></textarea>
                </div>
                <div class="actions">
                    <button type="submit" class="btn">保存日志</button>
                    <a href="/logs" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function showMessage(text, type) {
            const area = document.getElementById('message-area');
            area.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => area.innerHTML = '', 3000);
        }

        // Set default date to today and generate slug
        const dateInput = document.getElementById('date');
        const titleInput = document.getElementById('title');
        const slugInput = document.getElementById('slug');
        
        dateInput.valueAsDate = new Date();
        
        function generateSlug() {
            const date = dateInput.value;
            const title = titleInput.value.trim();
            if (!date || !title) {
                slugInput.value = '';
                return;
            }
            // Simple slug: date + sanitized title (keep alphanumeric, convert spaces to dashes)
            const slugPart = title
                .toLowerCase()
                .replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-')
                .replace(/^-|-$/g, '')
                .slice(0, 50);
            slugInput.value = `${date}-${slugPart}`;
        }
        
        titleInput.addEventListener('input', generateSlug);
        dateInput.addEventListener('change', generateSlug);
        generateSlug();

        document.getElementById('log-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            if (!data.slug) {
                showMessage('请填入标题以生成文件名', 'error');
                return;
            }
            try {
                const res = await fetch('/api/logs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    showMessage('保存成功！跳转到日志列表...');
                    setTimeout(() => {
                        window.location.href = '/logs';
                    }, 1000);
                } else {
                    showMessage(result.error || '保存失败', 'error');
                }
            } catch (err) {
                showMessage('网络错误', 'error');
            }
        });
    </script>
</body>
</html>
